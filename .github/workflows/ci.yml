name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macos-26 has Xcode 26.x installed (actions/runner-images, macos-26-arm64-Readme.md).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build -project cfind.xcodeproj -scheme cfind \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO

      - name: Build for macOS
        run: |
          xcodebuild build -project cfind.xcodeproj -scheme cfind \
            -destination 'platform=macOS' \
            -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Unit tests on macOS
        run: |
          xcodebuild test -project cfind.xcodeproj -scheme cfind \
            -destination 'platform=macOS' -only-testing:cfindTests \
            -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Unit tests on an iOS Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for devices in json.load(sys.stdin)["devices"].values():
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit()
          ')
          if [ -z "$udid" ]; then
            echo "::notice::No iPhone simulator available, skipping the iOS unit tests"
            exit 0
          fi
          xcodebuild test -project cfind.xcodeproj -scheme cfind \
            -destination "id=$udid" -only-testing:cfindTests \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO
