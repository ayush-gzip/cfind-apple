name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      # The iPhone app is not shipped (it needs a paid Apple account). This only checks that it builds.
      - name: Check the iOS build
        run: |
          xcodebuild build -project cfind.xcodeproj -scheme cfind \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO

      - name: Build the Mac app
        run: |
          xcodebuild build -project cfind.xcodeproj -scheme cfind \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/mac \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Zip the Mac app
        run: |
          ditto -c -k --keepParent build/mac/Build/Products/Release/cfind.app "cfind-macos-${GITHUB_REF_NAME}.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          The Mac app, ad-hoc signed. The first time, right-click cfind.app and choose Open.

          It needs the cfind daemon from https://github.com/ayush-gzip/context-find running on the same Mac.

          The iPhone app is not in the release. Build it with Xcode (see the README).
          NOTES
          gh release create "$GITHUB_REF_NAME" "cfind-macos-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
